[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imdb-mcp"
version = "1.0.0"
description = "MCP server for IMDb: titles, people, charts, search, and your own ratings and watchlist"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["imdb", "mcp", "movies", "ratings", "model-context-protocol"]

dependencies = [
    # <2 until the MCPServer migration: 2.x moved mcp.server.fastmcp
    "mcp>=1.30.0,<2",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
imdb-mcp = "imdb_mcp.server:main"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/imdb_mcp"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Tools have to hand every failure back as a structured error string; an
# exception escaping into the stdio stream kills the session.
"src/imdb_mcp/server.py" = ["BLE001"]
