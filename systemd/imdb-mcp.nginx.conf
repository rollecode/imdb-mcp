# Front door for the IMDb MCP, behind a Cloudflare Tunnel.
#
# The login lives in the Node service on :8622, which handles the OAuth 2.1
# sign-in and also accepts a fixed token. nginx only passes traffic along;
# :8620, the server itself, has no login and is never put online.
server {
    listen 127.0.0.1:8621;
    server_name imdb-mcp.example.com;

    location / {
        proxy_pass http://127.0.0.1:8622;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # The MCP holds the connection open and sends as it goes.
        proxy_read_timeout 1d;
        proxy_buffering off;
    }
}
